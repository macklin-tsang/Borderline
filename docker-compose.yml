services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: borderline
      POSTGRES_USER: borderline
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # localhost only: don't expose the database to the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borderline -d borderline"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
